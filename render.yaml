# Render Blueprint — TeachNest Phase 1 backend (FastAPI)
# Deploy: Render Dashboard -> New -> Blueprint -> connect this repo.
# Uses SQLite on the service's ephemeral filesystem for the Phase 1 demo:
# the database is created and seeded automatically on every start, so demo
# data (admin / Admin@123) is always available, but any data created in the
# live demo is lost on restart/redeploy. Switch to Render Postgres for
# persistent data (set DATABASE_URL accordingly).
services:
  - type: web
    name: teachnest-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://teachnest.vercel.app
